services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: decisions_api_test_development
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    command: bin/dev
    volumes:
      - .:/opt/app
      - bundle:/usr/local/bundle
    ports:
      - "3000:3000"
    environment:
      BINDING: "0.0.0.0"
      DATABASE_HOST: db
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DOCKER: "true"
    depends_on:
      db:
        condition: service_healthy
    stdin_open: true
    tty: true
    init: true

volumes:
  postgres_data:
  bundle:
